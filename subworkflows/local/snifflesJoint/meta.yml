name: "snifflesJoin"
description: Call structural variants jointly using Sniffles
keywords:
  - sv calling
  - sniffles
  - long-read sequencing
components:
  - sniffles
input:
  - ch_bam_bai:
      type: file
      description: |
        Channel containing sample information (meta), BAM and BAI files
        Structure: [ val(meta), path(bam), path(bai) ]
      pattern: "*.{bam,cram}"
output:
  - vcf:
      type: file
      description: |
        Channel containing sample information (meta, with sv_caller, needs_reheader, skip_vep_prep stamped)
        and raw VCF file
        Structure: [ val(meta), path(vcf) ]
      pattern: "*.vcf.gz"
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"
authors:
  - "@stautis"
maintainers:
  - "@stautis"
